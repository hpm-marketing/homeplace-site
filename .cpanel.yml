---
# Deploy pelo Git Version Control do cPanel (Pull or Deploy > Deploy HEAD Commit).
# O site e gerado no computador com "npm run build:cpanel" (pasta deploy/).
# Aqui o servidor so copia os arquivos prontos para o public_html.
# Se o site ficar em outra pasta (subdominio/addon domain), troque DEPLOYPATH.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/rm -rf $DEPLOYPATH/_next
    - /bin/cp -R deploy/. $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/videos
    - /bin/cp -R public/videos/. $DEPLOYPATH/videos/
